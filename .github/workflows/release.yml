name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: Build binaire musl statique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust + target musl
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-release

      - name: Installer musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Build release statique
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-musl \
            -p moli-host

      - name: Vérifier le binaire
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/moli-host
          ls -lh "$BIN"
          file "$BIN"
          ldd "$BIN" 2>&1 || true

      - name: Upload artefact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: moli-host-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/moli-host
          retention-days: 7

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-musl/release/moli-host
          name: Moli OS ${{ github.ref_name }}
          body: |
            ## Installation rapide

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ronanm35/moli-os/main/install.sh | sudo bash
            ```

            Ou manuellement :

            ```bash
            # Télécharger le binaire
            curl -fsSL \
              https://github.com/ronanm35/moli-os/releases/download/${{ github.ref_name }}/moli-host \
              -o /usr/local/bin/moli-host
            chmod +x /usr/local/bin/moli-host

            # Configurer
            mkdir -p /etc/moli
            # Éditez /etc/moli/home.toml

            # Activer le service
            curl -fsSL \
              https://raw.githubusercontent.com/ronanm35/moli-os/main/moli-os.service \
              -o /etc/systemd/system/moli-os.service
            systemctl daemon-reload
            systemctl enable --now moli-os
            ```

            **Taille du binaire** : ~8 Mo
            **RAM au repos** : ~10 Mo
            **Dépendances runtime** : aucune (musl statique)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
